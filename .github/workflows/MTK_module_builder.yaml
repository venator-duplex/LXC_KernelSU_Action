name: Build MTK Connectivity Modules (Standalone, clang r383902)

on:
  workflow_dispatch:

jobs:
  build-modules:
    runs-on: ubuntu-22.04

    steps:
      # ========== 1. 检出内核源码（提供头文件和构建脚本） ==========
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'light-u-oss'
          path: 'kernel'

      # ========== 2. 检出 MTK Connectivity 模块源码 ==========
      - name: Checkout MTK connectivity modules
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/MTK_kernel_modules'
          ref: 'light-u-oss'
          path: 'connectivity'

      # ========== 3. 下载之前编译内核生成的 Module.symvers ==========
      - name: Download Module.symvers
        uses: actions/download-artifact@v4
        with:
          name: module-symvers
          run-id: 37089845891
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: 'kernel/'

      # ========== 4. 安装编译依赖 ==========
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make python3 bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            wget

      # ========== 5. 下载 clang r383902（已验证可用的方式） ==========
      - name: Download Clang r383902
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902.tar.gz
          tar -xzf clang-r383902.tar.gz
          echo "$HOME/toolchain/bin" >> $GITHUB_PATH
          echo "=== clang 版本 ==="
          $HOME/toolchain/bin/clang --version

      # ========== 6. 确认 Module.symvers 存在 ==========
      - name: Verify Module.symvers
        run: |
          ls -la kernel/Module.symvers
          wc -l kernel/Module.symvers

      # ========== 7. 准备内核头文件（不编译整个内核） ==========
      - name: Prepare kernel headers
        working-directory: ./kernel
        env:
          PATH: "$HOME/toolchain/bin:/usr/bin:/bin"
        run: |
          cp arch/arm64/configs/light_defconfig .config
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- modules_prepare

      # ========== 8. 自动定位 Makefile 并编译模块 ==========
      - name: Build connectivity modules
        env:
          PATH: "$HOME/toolchain/bin:/usr/bin:/bin"
        run: |
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          CONNECTIVITY_DIR="$GITHUB_WORKSPACE/connectivity"

          # 自动查找包含 Makefile 的目录
          MAKEFILE_PATH=$(find "$CONNECTIVITY_DIR" -name "Makefile" -maxdepth 4 | head -n 1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "错误: 未找到 Makefile"
            find "$CONNECTIVITY_DIR" -type f \( -name "Makefile" -o -name "Kbuild" \) | head -20
            exit 1
          fi
          MODULE_DIR=$(dirname "$MAKEFILE_PATH")
          echo "=== 找到 Makefile: $MAKEFILE_PATH ==="
          echo "=== 模块目录: $MODULE_DIR ==="

          cd "$MODULE_DIR"
          make -C "$KERNEL_DIR" \
            M="$MODULE_DIR" \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            modules \
            -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/connectivity_build.log" || true

      # ========== 9. 收集 .ko 文件 ==========
      - name: Collect .ko files
        run: |
          mkdir -p output
          find connectivity/ -name "*.ko" -exec cp {} output/ \;
          echo "=== 找到的模块文件 ==="
          ls -la output/

      # ========== 10. 上传构建产物 ==========
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtk-connectivity-modules
          path: output/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: connectivity-build-log
          path: connectivity_build.log
          if-no-files-found: warn
