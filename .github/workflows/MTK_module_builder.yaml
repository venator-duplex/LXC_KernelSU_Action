name: Build MT6833 WiFi Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: light-u-oss
          path: kernel

      - name: Checkout MTK kernel modules
        uses: actions/checkout@v4
        with:
          repository: MiCode/MTK_kernel_modules
          ref: light-u-oss
          path: modules

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make python3 bc bison flex libssl-dev \
            libncurses5-dev libncursesw5-dev zip wget cpio rsync

      - name: Setup clang r383902
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902.tar.gz
          tar -xzf clang-r383902.tar.gz
          echo "$HOME/toolchain/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          clang --version
          ld.lld --version

      - name: Set up kernel build environment
        run: |
          cd kernel
          # 使用原厂 defconfig（从设备提取的 config 或 light_defconfig）
          cp arch/arm64/configs/light_defconfig .config
          # 关闭导致问题的选项
          scripts/config --disable MODVERSIONS
          scripts/config --disable MODULE_SIG
          scripts/config --disable MODULE_SIG_FORCE
          # 对齐 vermagic
          scripts/config --set-str LOCALVERSION "-perf-g25e98838903c"
          scripts/config --disable LOCALVERSION_AUTO

      - name: Prepare modules
        run: |
          # 将 connectivity 模块放入内核树外部模块目录
          mkdir -p kernel/vendor/mediatek/kernel_modules
          cp -r modules/connectivity kernel/vendor/mediatek/kernel_modules/
          # 修正平台 ID（关键）
          sed -i 's/WLAN_CHIP_ID=6765/WLAN_CHIP_ID=6833/' \
            kernel/vendor/mediatek/kernel_modules/connectivity/Makefile
          sed -i 's/MTK_COMBO_CHIP=CONNAC/MTK_COMBO_CHIP=CONNAC2X2/' \
            kernel/vendor/mediatek/kernel_modules/connectivity/Makefile

      - name: Build kernel modules
        run: |
          cd kernel
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LOCALVERSION="-perf-g25e98838903c" \
            CONFIG_MTK_COMBO=y \
            CONFIG_MTK_COMBO_WIFI=y \
            CONFIG_MTK_COMBO_CHIP_CONSYS_6833=y \
            WIFI_IP_SET=3 \
            M=vendor/mediatek/kernel_modules/connectivity \
            modules

      - name: Collect .ko files
        run: |
          mkdir -p output
          find kernel -name "*.ko" -exec cp {} output/ \;
          ls -la output/

      - name: Verify vermagic
        run: |
          for ko in output/*.ko; do
            echo "=== $ko ==="
            strings "$ko" | grep vermagic || echo "no vermagic found"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-module-mt6833
          path: output/*.ko
