name: Build MTK Connectivity Modules (Standalone)

on:
  workflow_dispatch:

jobs:
  build-modules:
    runs-on: ubuntu-22.04

    steps:
      # ========== 1. 检出内核源码（仅用于提供构建环境） ==========
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'light-u-oss'
          path: 'kernel'

      # ========== 2. 检出 MTK Connectivity 模块源码 ==========
      - name: Checkout MTK connectivity modules
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/MTK_kernel_modules'
          ref: 'light-u-oss'
          path: 'connectivity'

      # ========== 3. 安装编译依赖 ==========
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make python3 bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu

      # ========== 4. 先编译内核，生成 Module.symvers ==========
      - name: Build kernel to generate Module.symvers
        working-directory: ./kernel
        run: |
          cp arch/arm64/configs/light_defconfig .config
          make ARCH=arm64 olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux
          echo "=== Module.symvers 是否生成 ==="
          ls -la Module.symvers

      # ========== 5. 单独编译 connectivity 模块 ==========
      - name: Build connectivity modules
        run: |
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          CONNECTIVITY_DIR="$GITHUB_WORKSPACE/connectivity"

          # 找到 connectivity 目录下实际的 Makefile 位置
          echo "=== 搜索 Makefile ==="
          find "$CONNECTIVITY_DIR" -name "Makefile" -maxdepth 4

          # 尝试在 connectivity 根目录编译
          cd "$CONNECTIVITY_DIR"
          make -C "$KERNEL_DIR" \
            M="$CONNECTIVITY_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules \
            -j$(nproc) 2>&1 | tee build.log || true

      # ========== 6. 收集 .ko 文件 ==========
      - name: Collect .ko files
        run: |
          mkdir -p output
          find connectivity/ -name "*.ko" -exec cp {} output/ \;
          echo "=== 找到的模块文件 ==="
          ls -la output/

      # ========== 7. 上传构建产物 ==========
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtk-connectivity-modules
          path: output/
          retention-days: 30
          if-no-files-found: warn
