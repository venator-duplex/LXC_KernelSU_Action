name: Build kernel use Google-git
on:
  watch:
    types: [started]

  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
    - uses: actions/checkout@v4
    - name: Prepare Configuration
      run: |
        CONFIG_ENV=$(cat config.env | grep -w "CONFIG_ENV" | head -n 1 | cut -d "=" -f 2)
        echo "KERNEL_SOURCE=$(cat $CONFIG_ENV | grep -w "KERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=$(cat $CONFIG_ENV | grep -w "KERNEL_SOURCE_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=$(cat $CONFIG_ENV | grep -w "KERNEL_CONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_IMAGE_NAME=$(cat $CONFIG_ENV | grep -w "KERNEL_IMAGE_NAME" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ARCH=$(cat $CONFIG_ENV | grep -w "ARCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "EXTRA_CMDS=$(cat $CONFIG_ENV | grep -w "EXTRA_CMDS" | head -n 1 | cut -d ":" -f 2)" >> $GITHUB_ENV
        echo "USE_CUSTOM_CLANG=$(cat $CONFIG_ENV | grep -w "USE_CUSTOM_CLANG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_CLANG_SOURCE=$(cat $CONFIG_ENV | grep -w "CUSTOM_CLANG_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_CLANG_BRANCH=$(cat $CONFIG_ENV | grep -w "CUSTOM_CLANG_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_CMDS=$(cat $CONFIG_ENV | grep -w "CUSTOM_CMDS" | head -n 1 | cut -d ":" -f 2)" >> $GITHUB_ENV
        echo "CLANG_BRANCH=$(cat $CONFIG_ENV | grep -w "CLANG_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CLANG_VERSION=$(cat $CONFIG_ENV | grep -w "CLANG_VERSION" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_GCC_ARM64=$(cat $CONFIG_ENV | grep -w "ENABLE_GCC_ARM64" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_GCC_ARM32=$(cat $CONFIG_ENV | grep -w "ENABLE_GCC_ARM32" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "USE_CUSTOM_GCC_64=$(cat $CONFIG_ENV | grep -w "USE_CUSTOM_GCC_64" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_64_SOURCE=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_64_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_64_BRANCH=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_64_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_64_BIN=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_64_BIN" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "USE_CUSTOM_GCC_32=$(cat $CONFIG_ENV | grep -w "USE_CUSTOM_GCC_32" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_32_SOURCE=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_32_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_32_BRANCH=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_32_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_32_BIN=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_32_BIN" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_KERNELSU=$(cat $CONFIG_ENV | grep -w "ENABLE_KERNELSU" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNELSU_TAG=$(cat $CONFIG_ENV | grep -w "KERNELSU_TAG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ADD_KPROBES_CONFIG=$(cat $CONFIG_ENV | grep -w "ADD_KPROBES_CONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "DISABLE-LTO=$(cat $CONFIG_ENV | grep -w "DISABLE-LTO" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ADD_OVERLAYFS_CONFIG=$(cat $CONFIG_ENV | grep -w "ADD_OVERLAYFS_CONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "DISABLE_CC_WERROR=$(cat $CONFIG_ENV | grep -w "DISABLE_CC_WERROR" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_CCACHE=$(cat $CONFIG_ENV | grep -w "ENABLE_CCACHE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "NEED_DTBO=$(cat $CONFIG_ENV | grep -w "NEED_DTBO" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "BUILD_BOOT_IMG=$(cat $CONFIG_ENV | grep -w "BUILD_BOOT_IMG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "SOURCE_BOOT_IMAGE=$(cat $CONFIG_ENV | grep -w "SOURCE_BOOT_IMAGE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KSU_EXPECTED_SIZE=$(cat $CONFIG_ENV | grep -w "KSU_EXPECTED_SIZE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KSU_EXPECTED_HASH=$(cat $CONFIG_ENV | grep -w "KSU_EXPECTED_HASH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_LXC=$(cat $CONFIG_ENV | grep -w "ENABLE_LXC" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        
    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "DEVICE=$(echo ${{ env.KERNEL_CONFIG }} | sed 's!vendor/!!;s/_defconfig//;s/_user//;s/-perf//')" >> $GITHUB_ENV
        sudo apt-get update
        #sudo apt-get install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3
        sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
        sudo -E apt-get -y -qq install build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Clang-aosp
      if: env.USE_CUSTOM_CLANG != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b ${{ env.CLANG_BRANCH }} clang-aosp
        

    - name: Download Google_gcc-4.9 
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
         #git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b ${{ env.CLANG_BRANCH }} gcc-64
         #git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b ${{ env.CLANG_BRANCH }} gcc-32

    - name: Download mkbootimg tools
      if: env.BUILD_BOOT_IMG == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg tools -b master-kernel-build-2022 --depth=1

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: Checkout Connectivity Modules
      uses: actions/checkout@v4
      with:
        repository: MiCode/MTK_kernel_modules
        ref: light-u-oss
        path: connectivity-modules

    - name: Configure Kernel for WiFi Firmware Path
      run: |
        set -e

        # 你的真实内核目录
        KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
        DEFCONFIG="${KERNEL_DIR}/arch/arm64/configs/light_defconfig"

        echo "=== 追加 WiFi 和固件相关配置 ==="
        for cfg in \
          "CONFIG_MTK_COMBO=y" \
          "CONFIG_MTK_COMBO_CHIP_CONSYS_6833=y" \
          "CONFIG_MTK_COMBO_WIFI=y" \
          "CONFIG_WLAN_DRV_BUILD_IN=y" \
          "CONFIG_MTK_COMBO_COMM=y" \
          "CONFIG_MTK_COMBO_COMM_SDIO=y" \
          "CONFIG_WLAN_DRV_BUILD_IN=y"
        do
          if ! grep -q "^${cfg}$" "${DEFCONFIG}"; then
            echo "${cfg}" >> "${DEFCONFIG}"
            echo "已追加: ${cfg}"
          fi
        done

        echo "=== 添加 firmware_class.path 启动参数 ==="
        if grep -q "^CONFIG_CMDLINE=" "${DEFCONFIG}"; then
          sed -i 's/^CONFIG_CMDLINE="\(.*\)"/CONFIG_CMDLINE="\1 firmware_class.path=\/vendor\/firmware"/' "${DEFCONFIG}"
          echo "已在现有 CONFIG_CMDLINE 中追加 firmware_class.path"
        else
          echo 'CONFIG_CMDLINE="firmware_class.path=/vendor/firmware"' >> "${DEFCONFIG}"
          echo "已添加新的 CONFIG_CMDLINE"
        fi

        if ! grep -q "^CONFIG_CMDLINE_EXTEND=y" "${DEFCONFIG}"; then
          echo "CONFIG_CMDLINE_EXTEND=y" >> "${DEFCONFIG}"
          echo "已启用 CONFIG_CMDLINE_EXTEND"
        fi

        echo "=== defconfig 中 CMDLINE 相关配置 ==="
        grep -n "CMDLINE" "${DEFCONFIG}"  

    - name: Place Connectivity Modules at Expected Path
      run: |
        set -e

        KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
        PARENT_DIR="$(dirname "${KERNEL_DIR}")"
        TARGET_DIR="${PARENT_DIR}/vendor/mediatek/kernel_modules/connectivity"
        CONNECTIVITY_DIR="${KERNEL_DIR}/drivers/misc/mediatek/connectivity"

        echo "=== 创建 MTK 驱动期望的路径 ==="
        mkdir -p "${TARGET_DIR}"

        echo "=== 复制 connectivity 内容到目标路径 ==="
        cp -r connectivity-modules/connectivity/. "${TARGET_DIR}/"

        echo "=== 检查目标路径结构 ==="
        ls -la "${TARGET_DIR}/"
        echo "--- wlan 目录 ---"
        ls -la "${TARGET_DIR}/wlan/" 2>/dev/null || echo "wlan 目录不存在"
        echo "--- wlan/core 目录 ---"
        ls -la "${TARGET_DIR}/wlan/core/" 2>/dev/null || echo "wlan/core 目录不存在"

        echo "=== 在 connectivity 目录下创建符号链接 ==="
        rm -f "${CONNECTIVITY_DIR}/wmt_drv"
        rm -f "${CONNECTIVITY_DIR}/wmt_chrdev_wifi"
        rm -f "${CONNECTIVITY_DIR}/wlan_drv_gen4m"

        # 根据实际目录结构创建链接
        if [ -d "${TARGET_DIR}/common" ]; then
            ln -sf "${TARGET_DIR}/common" "${CONNECTIVITY_DIR}/wmt_drv"
        fi
        if [ -d "${TARGET_DIR}/wlan/adaptor" ]; then
            ln -sf "${TARGET_DIR}/wlan/adaptor" "${CONNECTIVITY_DIR}/wmt_chrdev_wifi"
        fi
        if [ -d "${TARGET_DIR}/wlan/core/gen4m" ]; then
            ln -sf "${TARGET_DIR}/wlan/core/gen4m" "${CONNECTIVITY_DIR}/wlan_drv_gen4m"
        fi

        echo "=== 验证链接 ==="
        ls -la "${CONNECTIVITY_DIR}/" | grep -E "wmt_drv|wmt_chrdev_wifi|wlan_drv_gen4m" || echo "链接未创建，请检查目录结构"
        echo "--- wlan_drv_gen4m 内容 ---"
        ls -la "${CONNECTIVITY_DIR}/wlan_drv_gen4m/" | head -20 2>/dev/null || echo "wlan_drv_gen4m 链接无效"

    - name: Patch Connectivity Makefile
      run: |
        set -e

        KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
        CONNECTIVITY_DIR="${KERNEL_DIR}/drivers/misc/mediatek/connectivity"
        MAKEFILE="${CONNECTIVITY_DIR}/Makefile"

        echo "=== 备份原始 Makefile ==="
        cp "${MAKEFILE}" "${MAKEFILE}.bak" 2>/dev/null || true

        echo "=== 写入补丁后的 Makefile ==="
        cat > "${MAKEFILE}" <<'MAKEFILE_EOF'
        # Connectivity combo driver Makefile (patched for CI build)
        
        ifneq ($(KERNELRELEASE),)
            subdir-ccflags-y += -I$(srctree)/
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/include
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/clkbuf/src
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/include/clkbuf_v1/$(MTK_PLATFORM)
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/include/mt-plat/$(MTK_PLATFORM)/include
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/include/mt-plat
            subdir-ccflags-y += -I$(srctree)/drivers/mmc/core
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/eccci/$(MTK_PLATFORM)
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/eccci/
            subdir-ccflags-y += -I$(srctree)/drivers/clk/mediatek/
            subdir-ccflags-y += -I$(srctree)/drivers/pinctrl/mediatek/
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/power_throttling/
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/pmic/include
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/pmic/include/mt6359
            subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/pmic/mt6359p/v1
        
            MODULE_NAME := connadp
            obj-$(CONFIG_MTK_COMBO) += $(MODULE_NAME).o
        
            $(MODULE_NAME)-objs += common/connectivity_build_in_adapter.o
            $(MODULE_NAME)-objs += common/wmt_build_in_adapter.o
            $(MODULE_NAME)-objs += power_throttling/adapter.o
            $(MODULE_NAME)-objs += power_throttling/core.o
        
            ifeq ($(CONFIG_MTK_COMBO), y)
                ccflags-y += -D CFG_CONNADP_BUILD_IN
            endif
        
            ifeq ($(CONFIG_WLAN_DRV_BUILD_IN),y)
                export CONFIG_MTK_COMBO_WIFI_HIF=axi
                export MTK_COMBO_CHIP=CONNAC
                export WLAN_CHIP_ID=6833
                export MTK_ANDROID_WMT=y
        
                subdir-ccflags-y += -D MTK_WCN_REMOVE_KERNEL_MODULE
                subdir-ccflags-y += -D MTK_WCN_BUILT_IN_DRIVER
        
                obj-y += wmt_drv/
                obj-y += wmt_chrdev_wifi/
                obj-y += wlan_drv_gen4m/
            endif
        
        else
            KERNELDIR ?= /lib/modules/$(shell uname -r)/build
            PWD  := $(shell pwd)
        default:
        	$(MAKE) -C $(KERNELDIR) M=$(PWD) modules
        endif
        MAKEFILE_EOF
        
                echo "=== Makefile 写入完成，关键行如下 ==="
                grep -n "obj-y +=" "${MAKEFILE}"
                grep -n "wmt_drv\|wmt_chrdev_wifi\|wlan_drv_gen4m" "${MAKEFILE}"

    - name: Patch gl_qa_agent.h for LIST_SEG_MAX
      run: |
        set -e
        QA_HEADER="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/drivers/misc/mediatek/connectivity/wlan_drv_gen4m/os/linux/include/gl_qa_agent.h"
        # 在第一次出现 LIST_SEG_MAX 的行之前插入兜底定义
        if ! grep -q "ifndef LIST_SEG_MAX" "$QA_HEADER"; then
          sed -i '/LIST_SEG_MAX/i #ifndef LIST_SEG_MAX\n#define LIST_SEG_MAX 100\n#endif' "$QA_HEADER"
          echo "已插入 LIST_SEG_MAX 兜底定义"
        fi
        grep -n -B3 "LIST_SEG_MAX" "$QA_HEADER" | head -20

    - name: Patch wlan_oid.c for LIST_MODE conditional
      run: |
        set -e

        KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
        PARENT_DIR="$(dirname "${KERNEL_DIR}")"
        WLAN_OID="${PARENT_DIR}/vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/common/wlan_oid.c"

        echo "=== 检查目标文件 ==="
        ls -la "${WLAN_OID}" || exit 1

        echo "=== 定位 nicCmdEventListmode 调用行 ==="
        LINE=$(grep -n "nicCmdEventListmode" "${WLAN_OID}" | head -1 | cut -d: -f1)
        echo "nicCmdEventListmode 出现在第 $LINE 行"

        if [ -z "$LINE" ]; then
          echo "ERROR: 没找到 nicCmdEventListmode"
          exit 1
        fi

        # 检查是否已经被 #if 包住
        if sed -n "$((LINE-15)),$((LINE))p" "${WLAN_OID}" | grep -q "CONFIG_WLAN_SERVICE"; then
          echo "调用已经处于 CONFIG_WLAN_SERVICE 条件内，跳过"
          exit 0
        fi

        # 往上找到 rStatus = wlanSendSetQueryCmd(prAdapter, 这一行
        START=$(awk -v l="$LINE" 'NR<=l && /rStatus = wlanSendSetQueryCmd\(prAdapter,/ {n=NR} END{print n}' "${WLAN_OID}")
        echo "调用块起始行: $START"

        # 往下找 rStatus = WLAN_STATUS_SUCCESS; 这一行
        END=$(awk -v l="$LINE" 'NR>=l && /rStatus = WLAN_STATUS_SUCCESS;/ {print NR; exit}' "${WLAN_OID}")
        echo "调用块结束行: $END"

        if [ -z "$START" ] || [ -z "$END" ]; then
          echo "ERROR: 无法定位调用块边界"
          exit 1
        fi

        # 在 END 行之后插入 #endif，在 START 行之前插入 #if
        sed -i "${END}a #endif /* CONFIG_WLAN_SERVICE == 1 */" "${WLAN_OID}"
        sed -i "${START}i #if (CONFIG_WLAN_SERVICE == 1)" "${WLAN_OID}"

        echo "=== 验证修改 ==="
        sed -n "$((START-2)),$((END+2))p" "${WLAN_OID}"

    - name: Patch nic_cmd_event.c for EMI symbols
      run: |
        set -e

        KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
        PARENT_DIR="$(dirname "${KERNEL_DIR}")"
        NIC_CMD_EVENT="${PARENT_DIR}/vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/nic/nic_cmd_event.c"

        ls -la "${NIC_CMD_EVENT}" || exit 1

        # 检查是否已经 patch 过
        if grep -q "ifndef WIFI_EMI_ADDR_MASK" "${NIC_CMD_EVENT}"; then
          echo "已 patch 过，跳过"
          exit 0
        fi

        # 在 #include "precomp.h" 之后插入兜底定义
        sed -i '/#include "precomp.h"/a\
        #ifndef WIFI_EMI_ADDR_MASK\
        #define WIFI_EMI_ADDR_MASK 0xFFFFFF\
        #endif\
        extern phys_addr_t gConEmiPhyBaseFinal;' "${NIC_CMD_EVENT}"
        
                echo "=== 验证 ==="
                grep -n -A6 '#include "precomp.h"' "${NIC_CMD_EVENT}" | head -15
    
    - name: Setup KernelSU
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        sed -i "s/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g" arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.0.5
      
    - name: Setup Configuration for Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        mkdir -p drivers/mihw
        cat > drivers/mihw/Makefile <<'EOF'
        # Placeholder Makefile to bypass missing Xiaomi mihw driver
        obj-y :=
        EOF
        sed -i 's/CONFIG_FRAME_WARN=.*/CONFIG_FRAME_WARN=8192/' arch/arm64/configs/light_defconfig
        grep -q "CONFIG_FRAME_WARN" arch/arm64/configs/light_defconfig || echo 'CONFIG_FRAME_WARN=8192' >> arch/arm64/configs/light_defconfig
        if [ ${{ env.ADD_KPROBES_CONFIG }} = true ]; then
            echo "CONFIG_MODULES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_HAVE_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_KPROBE_EVENTS=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.ADD_OVERLAYFS_CONFIG }} = true ]; then
            echo "CONFIG_OVERLAY_FS=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.DISABLE-LTO }} = true ]; then
            sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_LTO_NONE=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.DISABLE_CC_WERROR }} = true ]; then
            echo "CONFIG_CC_WERROR=n" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        
    - name: Setup LXC
      if: env.ENABLE_LXC == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf utils
        git clone https://github.com/tomxi1997/lxc-docker-support-for-android.git utils
        echo 'source "utils/Kconfig"' >> "Kconfig"

        echo "CONFIG_DOCKER=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}

        sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
          
        #sed -i '/CONFIG_LOCALVERSION/d' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        #echo 'CONFIG_LOCALVERSION="-LXC-KernelSU-support_Pdx"' >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
          
        chmod +x $GITHUB_WORKSPACE/kernel_workspace/android-kernel/utils/runcpatch.sh
        if [ -f $GITHUB_WORKSPACE/kernel_workspace/android-kernel/kernel/cgroup/cgroup.c ]; then
            sh $GITHUB_WORKSPACE/kernel_workspace/android-kernel/utils/runcpatch.sh $GITHUB_WORKSPACE/kernel_workspace/android-kernel/kernel/cgroup/cgroup.c
        fi

        if [ -f $GITHUB_WORKSPACE/kernel_workspace/android-kernel/kernel/cgroup.c ]; then
            sh $GITHUB_WORKSPACE/kernel_workspace/android-kernel/utils/runcpatch.sh $GITHUB_WORKSPACE/kernel_workspace/android-kernel/kernel/cgroup.c
        fi

        if [ -f $GITHUB_WORKSPACE/kernel_workspace/android-kernel/net/netfilter/xt_qtaguid.c ]; then
            patch -p0 < $GITHUB_WORKSPACE/kernel_workspace/android-kernel/utils/xt_qtaguid.patch
        fi
       
    - name: Setup ccache
      if: env.ENABLE_CCACHE == 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-${{ env.DEVICE }}${{ env.UPLOADNAME }}
        max-size: 2G

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export CONFIG_WLAN_DRV_BUILD_IN=y
        export MTK_PLATFORM=mt6833   # 请替换为你实际的目标平台，如 mt6771, mt6785 等
        export MTK_COMBO_CHIP=CONNAC
        export WLAN_CHIP_ID=6833      # 请替换为你实际的芯片ID
        export MTK_ANDROID_WMT=y
        EXTRA_CFLAGS="-DCFG_SUPPORT_LIST_MODE=1"
        EXTRA_CFLAGS="-DCFG_SUPPORT_TPUT_FACTOR=0 -DCFG_MTK_ANDROID_EMI=0 ..."
        #export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-${{ env.CLANG_VERSION }}/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        if [ ! -z ${{ env.KSU_EXPECTED_SIZE }} ] && [ ! -z ${{ env.KSU_EXPECTED_HASH }} ]; then
          export KSU_EXPECTED_SIZE=${{ env.KSU_EXPECTED_SIZE }}
          export KSU_EXPECTED_HASH=${{ env.KSU_EXPECTED_HASH }}
        fi
        make -j$(nproc --all) CC=clang O=out ARCH=${{ env.ARCH }} ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- ${{ env.KERNEL_CONFIG }}
        if [ ${{ env.ENABLE_CCACHE }} = true ]; then
            make -j$(nproc --all) CC="ccache clang" O=out ARCH=${{ env.ARCH }} ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- 
        else
            make -j$(nproc --all) CC=clang O=out ARCH=${{ env.ARCH }} ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- 
        fi

    - name: Check a kernel output files
      run: |
       cd $GITHUB_WORKSPACE/kernel_workspace
       if [ -f android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} ]; then
           echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
       else
           echo "Kernel output file is empty"
           exit 1
       fi
       if [ ${{ env.NEED_DTBO }} = true ]; then
           if [ -f android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img ]; then
               echo "CHECK_DTBO_IS_OK=true" >> $GITHUB_ENV
           else
               echo "DTBO image is empty"
               exit 1
           fi
       fi
  
    - name: Make Anykernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        if [ ${{ env.CHECK_DTBO_IS_OK }} = true ]; then
            cp android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img AnyKernel3/
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Make boot image
      if: env.HAVE_SOURCE_BOOT_IMAGE == 'true' && env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        tools/unpack_bootimg.py --boot_img boot-source.img
        cp android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} out/kernel
        tools/mkbootimg.py ${{ env.FORMAT_MKBOOTING }} -o boot.img
        if [ -f boot.img ]; then
            echo "MAKE_BOOT_IMAGE_IS_OK=true" >> $GITHUB_ENV
        else
            echo "Boot image is empty"
            exit 1
        fi
    
    - name: Upload ${{ env.KERNEL_IMAGE_NAME }}
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_IMAGE_NAME }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}

    - name: Upload AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/AnyKernel3/*

    - name: Upload DTBO image
      if: env.CHECK_DTBO_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: dtbo-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img

    - name: Upload boot image
      if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: boot${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/boot.img
