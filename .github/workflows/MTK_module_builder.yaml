name: Build MTK Connectivity Modules (Standalone)

on:
  workflow_dispatch:

jobs:
  build-modules:
    runs-on: ubuntu-22.04

    steps:
      # ========== 1. 检出内核源码（提供头文件和构建脚本） ==========
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'light-u-oss'
          path: 'kernel'

      # ========== 2. 检出 MTK Connectivity 模块源码 ==========
      - name: Checkout MTK connectivity modules
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/MTK_kernel_modules'
          ref: 'light-u-oss'
          path: 'connectivity'

      # ========== 3. 下载之前编译内核生成的 Module.symvers ==========
      - name: Download Module.symvers
        uses: actions/download-artifact@v4
        with:
          name: module-symvers
          path: 'kernel/'

      # ========== 4. 安装编译依赖 ==========
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl wget git make bc bison flex libssl-dev \
            python3 zip unzip device-tree-compiler kmod

      # ========== 5. 下载 clang-r383902b 工具链（使用你验证可用的方式） ==========
      - name: Download Clang r383902b
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p clang-aosp
          git clone https://github.com/tomxi1997/Toolchain.git clang-aosp --depth=1
          echo "=== 工具链目录结构 ==="
          ls -la "$GITHUB_WORKSPACE/clang-aosp/"

      # ========== 6. 确认 Module.symvers 存在 ==========
      - name: Verify Module.symvers
        run: |
          ls -la kernel/Module.symvers
          wc -l kernel/Module.symvers

      # ========== 7. 准备内核头文件（不编译整个内核） ==========
      - name: Prepare kernel headers
        working-directory: ./kernel
        env:
          PATH: "${{ github.workspace }}/clang-aosp/google_clang/clang-r383902b-11.0.2/bin:${{ github.workspace }}/clang-aosp/google_gcc/aarch64-linux-android-4.9/bin:${{ github.workspace }}/clang-aosp/google_gcc/arm-linux-androideabi-4.9/bin:/usr/bin:/bin"
        run: |
          cp arch/arm64/configs/light_defconfig .config
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- olddefconfig
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- modules_prepare

      # ========== 8. 自动定位 Makefile 并编译模块 ==========
      - name: Build connectivity modules
        env:
          PATH: "${{ github.workspace }}/clang-aosp/google_clang/clang-r383902b-11.0.2/bin:${{ github.workspace }}/clang-aosp/google_gcc/aarch64-linux-android-4.9/bin:${{ github.workspace }}/clang-aosp/google_gcc/arm-linux-androideabi-4.9/bin:/usr/bin:/bin"
        run: |
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          CONNECTIVITY_DIR="$GITHUB_WORKSPACE/connectivity"

          echo "=== connectivity 目录结构 ==="
          ls -la "$CONNECTIVITY_DIR"

          echo "=== 搜索 Makefile ==="
          find "$CONNECTIVITY_DIR" -name "Makefile" -maxdepth 4

          # 自动查找包含 Makefile 的目录
          MAKEFILE_PATH=$(find "$CONNECTIVITY_DIR" -name "Makefile" -maxdepth 4 | head -n 1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "错误: 未找到 Makefile"
            exit 1
          fi
          MODULE_DIR=$(dirname "$MAKEFILE_PATH")
          echo "=== 找到 Makefile: $MAKEFILE_PATH ==="
          echo "=== 模块目录: $MODULE_DIR ==="

          cd "$MODULE_DIR"
          make -C "$KERNEL_DIR" \
            M="$MODULE_DIR" \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            modules \
            -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/connectivity_build.log" || true

      # ========== 9. 收集 .ko 文件 ==========
      - name: Collect .ko files
        run: |
          mkdir -p output
          find connectivity/ -name "*.ko" -exec cp {} output/ \;
          echo "=== 找到的模块文件 ==="
          ls -la output/

      # ========== 10. 上传构建产物 ==========
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtk-connectivity-modules
          path: output/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: connectivity-build-log
          path: connectivity_build.log
          if-no-files-found: warn
