name: Build MTK WLAN Driver (Standalone, Full)

on:
  workflow_dispatch:

jobs:
  build-wlan:
    runs-on: ubuntu-22.04

    steps:
      # ========== 1. 检出内核源码 ==========
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'light-u-oss'
          path: 'kernel'

      # ========== 2. 检出 MTK Connectivity 模块源码 ==========
      - name: Checkout MTK connectivity modules
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/MTK_kernel_modules'
          ref: 'light-u-oss'
          path: 'connectivity'

      # ========== 3. 下载之前编译内核生成的 Module.symvers ==========
      - name: Download Module.symvers
        uses: actions/download-artifact@v4
        with:
          name: module-symvers
          run-id: 37089845891
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: 'kernel/'

      # ========== 4. 安装编译依赖 ==========
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make python3 bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ========== 5. 下载 clang r383902 ==========
      - name: Download Clang r383902
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            -b android12-release clang-aosp
          echo "=== clang 版本 ==="
          "$GITHUB_WORKSPACE/clang-aosp/clang-r383902/bin/clang" --version

      # ========== 6. 确认 Module.symvers 存在 ==========
      - name: Verify Module.symvers
        run: |
          ls -la kernel/Module.symvers
          wc -l kernel/Module.symvers

      # ========== 7. 准备内核头文件 ==========
      - name: Prepare kernel headers
        working-directory: ./kernel
        env:
          PATH: "${{ github.workspace }}/clang-aosp/clang-r383902/bin:/usr/bin:/bin"
        run: |
          cp arch/arm64/configs/light_defconfig .config
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- modules_prepare

      - name: Setup vendor directory structure
        run: |
          BASE="$GITHUB_WORKSPACE/connectivity/connectivity"
          VENDOR="$GITHUB_WORKSPACE/vendor/mediatek/kernel_modules/connectivity"

          mkdir -p "$VENDOR"

          # 把 connectivity 源码复制到 vendor 路径下
          cp -r "$BASE/common" "$VENDOR/"
          cp -r "$BASE/wlan" "$VENDOR/"
          cp -r "$BASE/conninfra" "$VENDOR/" 2>/dev/null || echo "conninfra 不存在"

          echo "=== vendor 目录结构 ==="
          ls -la "$VENDOR/"
          echo "=== common ==="
          ls -la "$VENDOR/common/" | head -20
          echo "=== conninfra ==="
          ls -la "$VENDOR/conninfra/" 2>/dev/null | head -20

      # ========== 8. 编译 wmt_drv（WMT 核心驱动） ==========
      - name: Build wmt_drv
        env:
          PATH: "${{ github.workspace }}/clang-aosp/clang-r383902/bin:/usr/bin:/bin"
        run: |
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          WMT_DIR="$GITHUB_WORKSPACE/connectivity/connectivity/common"

          echo "=== 确认 wmt_drv 目录存在 ==="
          ls -la "$WMT_DIR/Makefile" 2>/dev/null || find "$GITHUB_WORKSPACE/connectivity" -name "Makefile" | grep -i "common"

          cd "$WMT_DIR"
          make -C "$KERNEL_DIR" \
            M="$WMT_DIR" \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_MTK_COMBO=m \
            CONFIG_WLAN_DRV_BUILD_IN=n \
            CONFIG_MTK_COMBO_WIFI_HIF=axi \
            WLAN_CHIP_ID=6833 \
            MTK_COMBO_CHIP=CONNAC2X2 \
            WIFI_IP_SET=3 \
            modules \
            -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/wmt_drv_build.log" || true

      # ========== 9. 编译 wmt_chrdev_wifi（字符设备接口） ==========
      - name: Build wmt_chrdev_wifi
        env:
          PATH: "${{ github.workspace }}/clang-aosp/clang-r383902/bin:/usr/bin:/bin"
        run: |
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          CHRDEV_DIR="$GITHUB_WORKSPACE/connectivity/connectivity/wlan/adaptor"

          echo "=== 确认 wmt_chrdev_wifi 目录存在 ==="
          ls -la "$CHRDEV_DIR/Makefile" 2>/dev/null || find "$GITHUB_WORKSPACE/connectivity/wlan" -name "Makefile" | grep -i "adaptor"

          cd "$CHRDEV_DIR"
          make -C "$KERNEL_DIR" \
            M="$CHRDEV_DIR" \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_MTK_COMBO=m \
            CONFIG_WLAN_DRV_BUILD_IN=n \
            CONFIG_MTK_COMBO_WIFI_HIF=axi \
            WLAN_CHIP_ID=6833 \
            MTK_COMBO_CHIP=CONNAC2X2 \
            WIFI_IP_SET=3 \
            modules \
            -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/wmt_chrdev_wifi_build.log" || true

      - name: Check includes in source
        run: |
          GEN4M="$GITHUB_WORKSPACE/connectivity/connectivity/wlan/core/gen4m"
          echo "=== plat_priv.c 的 include ==="
          grep -n "#include" "$GEN4M/os/linux/plat/mt6833/plat_priv.c" | head -20
          echo "=== gl_qa_agent.h 的 include ==="
          grep -n "#include" "$GEN4M/os/linux/include/gl_qa_agent.h" | head -20
          echo "=== wlan_oid.c 中 nicCmdEventListmode 附近 ==="
          grep -n "nicCmdEventListmode" "$GEN4M/common/wlan_oid.c" | head -5
          echo "=== nic_cmd_event.h 中 nicCmdEventListmode 附近 ==="
          grep -n "nicCmdEventListmode" "$GEN4M/include/nic_cmd_event.h" | head -5
      - name: Build gen4m WLAN driver
        env:
          PATH: "${{ github.workspace }}/clang-aosp/clang-r383902/bin:/usr/bin:/bin"
        run: |
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          GEN4M_DIR="$GITHUB_WORKSPACE/connectivity/connectivity/wlan/core/gen4m"
          BASE="$GITHUB_WORKSPACE/connectivity/connectivity"

          export KCFLAGS="-I$BASE/common/common_main/include \
          -I$BASE/common/common_main/linux/include \
          -I$BASE/common/debug_utility \
          -I$BASE/conninfra/include \
          -I$BASE/conninfra/base/include \
          -I$BASE/conninfra/debug_utility/include \
          -I$BASE/wlan/adaptor \
          -I$BASE/wlan/core/gen4m/include \
          -I$BASE/wlan/core/gen4m/include/nic \
          -I$BASE/wlan/core/gen4m/include/mgmt \
          -I$BASE/wlan/core/gen4m/include/chips \
          -I$BASE/wlan/core/gen4m/os/linux/include"

          cd "$GEN4M_DIR"
          make -C "$KERNEL_DIR" \
            M="$GEN4M_DIR" \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_MTK_COMBO_WIFI=m \
            CONFIG_WLAN_DRV_BUILD_IN=n \
            CONFIG_MTK_COMBO_WIFI_HIF=axi \
            WLAN_CHIP_ID=6833 \
            MTK_COMBO_CHIP=CONNAC2X2 \
            WIFI_IP_SET=3 \
            modules \
            -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/gen4m_build.log" || true

      # ========== 11. 收集 .ko 文件 ==========
      - name: Collect .ko files
        run: |
          mkdir -p output
          find connectivity/ -name "*.ko" -exec cp {} output/ \;
          echo "=== 找到的模块文件 ==="
          ls -la output/

      # ========== 12. 上传构建产物 ==========
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtk-wlan-modules
          path: output/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: wlan-build-logs
          path: |
            wmt_drv_build.log
            wmt_chrdev_wifi_build.log
            gen4m_build.log
          if-no-files-found: warn
